name: Validate dt-algokit-utils

# Reusable: called by ci.yml on pushes and pull requests, and by cd.yml before publishing
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install algokit
        run: pipx install algokit

      # Most tests run against LocalNet; the dtalgod live tests skip without DT_ALGOD_SERVER
      - name: Start LocalNet
        run: algokit localnet start

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check-types

      - name: Lint
        run: npm run lint

      # Blocking: the dependencies the published package installs
      - name: Audit production dependencies
        run: npm run audit -- -p

      # Advisory: dev tooling (vitest's vite, ...) often has advisories that don't reach the package
      - name: Audit all dependencies
        continue-on-error: true
        run: npm run audit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test -- --silent
