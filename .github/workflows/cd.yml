name: Publish to npm

# Pushing a tag v<version> (e.g. v9.2.3-dt.2.0.0.1) validates that commit and publishes dist/ to npm.
# Upstream tags (v9.2.3-beta.2, ...) don't match the pattern, so pushing them doesn't publish.
on:
  push:
    tags: ['v*-dt.*']

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/dt-ci.yml

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance
      id-token: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Check the tag matches package.json
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version: tag v$version instead"
            exit 1
          fi
          echo "PACKAGE=$name@$version" >> "$GITHUB_ENV"

      - name: Check whether this version is already on npm
        id: published
        run: |
          if npm view "$PACKAGE" version >/dev/null 2>&1; then
            echo "::notice::$PACKAGE is already on npm; skipping the publish"
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.already != 'true'
        run: npm ci

      - name: Build
        if: steps.published.outputs.already != 'true'
        run: npm run build

      # Publishes dist/, never the repo root. Authenticates with trusted publishing when it's set up on npmjs.com,
      # otherwise with the NPM_TOKEN secret. `--tag latest` because npm 11 needs a tag for prereleases.
      - name: Publish
        if: steps.published.outputs.already != 'true'
        run: npm publish ./dist --tag latest --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
